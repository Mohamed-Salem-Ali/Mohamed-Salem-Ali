<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="MSY">
  <title>MSY</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#4fd1a5"/></linearGradient>
    <linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141922"/><stop offset="1" stop-color="#0f131a"/></linearGradient>
  </defs>
  <style>
    /* One 6 s cycle: outline draws (0-0.8 s), letters draw in turn (0.6-1.9 s), live dot lands and
       starts its heartbeat, hold, fade, repeat. Letters are real strokes, so no font is needed. */
    .all { animation: cycle 6s ease-in-out infinite; }
    .tile { opacity: 0; animation: fillin 6s ease-out infinite; }
    .outline, .ch { stroke-dasharray: 1 2; stroke-dashoffset: 1; }
    .outline { animation: draw-o 6s cubic-bezier(.65,0,.35,1) infinite; }
    .outline-full { opacity: 0; animation: full 6s ease-out infinite; }
    .ch { animation: draw-c 6s cubic-bezier(.65,0,.35,1) infinite; }
    .c2 { animation-delay: .22s; } .c3 { animation-delay: .44s; }
    .dotg { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0); animation: pop 6s cubic-bezier(.2,.9,.3,1.4) infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out 2.4s infinite; }
    @keyframes cycle { 0%,90% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes fillin { 0%,8% { opacity: 0 } 16%,100% { opacity: 1 } }
    @keyframes full { 0%,12% { opacity: 0 } 15%,100% { opacity: 1 } }
    @keyframes draw-o { 0% { stroke-dashoffset: 1 } 13% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
    @keyframes draw-c { 0%,10% { stroke-dashoffset: 1 } 20%,100% { stroke-dashoffset: 0 } }
    @keyframes pop { 0%,34% { opacity: 0; transform: scale(0) } 39% { opacity: 1; transform: scale(1.4) } 43%,100% { opacity: 1; transform: scale(1) } }
    @keyframes ping { 0% { transform: scale(1); opacity: .75 } 100% { transform: scale(3.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .all, .tile, .outline, .outline-full, .ch, .dotg { animation: none !important; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .ring { animation: none !important; opacity: 0; }
    }
  </style>
  <g class="all">
    <rect class="tile" x="8" y="8" width="104" height="104" rx="26" fill="url(#fd)"/>
    <rect class="outline-full" x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="url(#g)" stroke-width="3.5"/>
    <rect class="outline" x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="url(#g)" stroke-width="3.5" pathLength="1"/>
    <g fill="none" stroke="#e7ecf2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path class="ch c1" pathLength="1" d="M32.5 70 V49 L39.5 61 L46.5 49 V70"/>
      <path class="ch c2" pathLength="1" d="M66 52.5 C64.5 49.5 60.5 48.5 57.5 49 C54 49.6 52.6 53.4 55.6 55.6 L64.4 62.6 C67.4 65 66 69 62.4 69.8 C58.8 70.5 54.6 69.2 53.4 66"/>
      <path class="ch c3" pathLength="1" d="M73 49 L80.5 61 L88 49 M80.5 61 V70"/>
    </g>
    <g class="dotg"><circle class="ring" cx="94" cy="95" r="3.6" fill="none" stroke="#4fd1a5" stroke-width="1.4"/><circle cx="94" cy="95" r="3.6" fill="#4fd1a5"/></g>
  </g>
</svg>
